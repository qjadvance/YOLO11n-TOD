nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]
backbone:
  - [-1, 1, RepParamStem, [128]]                # 0-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]      # 1
  - [-1, 1, Conv, [256, 3, 2]]             # 2-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]      # 3
  - [-1, 1, Conv, [512, 3, 2]]             # 4-P4/16
  - [-1, 2, C3k2, [512, True]]             # 5
  - [-1, 1, DFB, [1024]]                   # 6-P5/32
  - [-1, 1, SPPF, [1024, 5]]                # 7
  - [-1, 2, C2PSA, [1024]]                  # 8

#  head（已集成SpaceToDepthConv、三路融合、CSPOmniBlock）
head:
  # ---------- 上采样路径 ----------
  - [-1, 1, UCSB, []]                    # 9: 输入(20) -> 上采样至40
  - [[-1, 5], 1, Concat, [1]]               # 10: 拼接9(40)和backbone5(40)
  - [-1, 2, C3k2, [512, False]]             # 11: 融合，尺寸40

  - [-1, 1, UCSB, []]                    # 12: 输入(40) -> 上采样至80
  - [[-1, 3], 1, Concat, [1]]               # 13: 拼接12(80)和backbone3(80)
  - [-1, 2, C3k2, [256, False]]             # 14: 融合，尺寸80 (中间P3)

  # ---------- 新增：P2特征 (80 -> 160) ----------
  - [-1, 1, UCSB, []]                    # 15: 输入(80) -> 上采样至160
  - [[-1, 0], 1, Concat, [1]]               # 16: 拼接15(160)和backbone0(160)
  - [-1, 2, C3k2, [128, False]]             # 17: 融合，尺寸160 (P2/4-xsmall 输出)

  # ---------- 下采样路径（P2 -> P3 增强融合） ----------
  # 从backbone0提取浅层特征，经SpaceToDepthConv降至80×80
  - [0, 1, SpaceToDepthConv, [256]]                  # 18: 输入backbone0(160) -> 80×80
  # 从P2下采样
  - [-3, 1, Conv, [128, 3, 2]]              # 19: 160→80（索引17，-3即上一层）
  # 三路融合：SpaceToDepthConv(18) + 上采样结果(14) + 下采样输入(19)
  - [[18, 14, 19], 1, Concat, [1]]          # 20: 拼接三路特征
  - [-1, 1, CSPOmniBlock, []]              # 21: 多尺度大核精炼
  - [-1, 2, C3k2, [256, False]]             # 22: 融合，尺寸80 (P3/8-small 输出)

  # ---------- 下采样路径（P3 -> P4） ----------
  - [-1, 1, Conv, [256, 3, 2]]              # 23: 80→40
  - [[-1, 11], 1, Concat, [1]]              # 24: 拼接23(40)和11(40)
  - [-1, 2, C3k2, [512, False]]             # 25: 融合，尺寸40 (P4/16-medium 输出)

  # ---------- 下采样路径（P4 -> P5） ----------
  - [-1, 1, Conv, [512, 3, 2]]              # 26: 40→20
  - [[-1, 8], 1, Concat, [1]]               # 27: 拼接26(20)和backbone8(20)
  - [-1, 2, C3k2, [1024, True]]             # 28: 融合，尺寸20 (P5/32-large 输出)

  # ---------- 检测头（四尺度） ----------
  - [[17, 22, 25, 28], 1, Detect, [nc]]     # 29: P2, P3, P4, P5